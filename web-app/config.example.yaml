runninghub:
  # Use https://www.runninghub.cn for China accounts. Override with
  # RUNNINGHUB_BASE_URL or this value if your account belongs to another region.
  base_url: "https://www.runninghub.cn"
  # System API key used only to read fixed workflow definitions when a customer
  # key cannot access them directly. Customer uploads/tasks still use customer keys.
  api_key: ""
  concurrent_limit: 1
  instance_type: plus

tts:
  qwen3_tts_base:
    # Keep false on servers that do not deploy the local voice-clone model.
    enabled: false
    # Compatible Qwen3-TTS Base directory, such as 0.6B-Base or 1.7B-Base.
    model_path: ""
    # Supported values: cpu, cuda, cuda:0, cuda:1, ...
    device: "cpu"
  default_language: "Chinese"
  # Default provider for the template-production module.
  default_provider: "Edge-TTS"
  edge_default_voice: "zh-CN-XiaoxiaoNeural"

llm:
  # Defaults seeded for the local default user. Each login user can override
  # these values from the Settings page.
  base_url: "https://api.openai.com/v1"
  api_key: ""
  model: ""

server:
  host: "0.0.0.0"
  port: 18888
  output_dir: "output"
