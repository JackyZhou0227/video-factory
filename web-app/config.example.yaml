runninghub:
  # 中国账号请使用 https://www.runninghub.cn。
  # 如果账号属于其他地区，可通过 RUNNINGHUB_BASE_URL 或此处覆盖。
  base_url: "https://www.runninghub.cn"

tasks:
  # 每个用户可占用的 pending/running 任务数；0 或负数表示不限制。
  max_running_tasks_per_user: 3
  # 全局任务池：最多同时执行 max_active_jobs 个，另允许 max_queued_jobs 个等待；全局接纳上限自动为二者之和。
  max_active_jobs: 10
  max_queued_jobs: 10
  # Qwen-TTS 的并发限制在 tts.qwen3_tts_base.concurrent_limit 中配置。

tts:
  qwen3_tts_base:
    # 不部署本地音色克隆模型的服务器请保持关闭。
    enabled: false
    # Qwen3-TTS Base 模型目录，例如 0.6B-Base 或 1.7B-Base。
    model_path: ""
    # 支持的值：cpu、cuda、cuda:0、cuda:1 等。
    device: "cpu"
    # 本地推理的最大并发数（1-8），建议先保持 1。
    concurrent_limit: 1

auth:
  # 是否开放自助注册。开启后注册需选择组织，账号进入待审批状态，
  # 由组织管理员或超级管理员批准后才能登录。
  registration_enabled: false
  # 首个设置密码的用户自动成为超级管理员（仅用于初始化，保持关闭）。
  allow_first_user_admin: false
  # 会话有效期（秒）与单用户最大会话数。
  session_max_age_seconds: 2592000
  max_sessions_per_user: 10
  # Cookie 安全属性。cookie_secure 不配置（注释掉）时按请求协议自动判断；
  # 反向代理终止 HTTPS 时建议显式设置为 true。
  # cookie_secure: true
  cookie_samesite: "lax"

database:
  # 正式服务启动必须提供 PostgreSQL 连接 URL。
  url: ""
  # 单进程的场景下，10 个持久连接 + 10 个突发是比较均衡的起点。
  pool_size: 10
  max_overflow: 10
  pool_timeout: 30

server:
  # 生产默认只监听本机，对外请通过反向代理/HTTPS 隧道暴露。
  host: "127.0.0.1"
  port: 18888
  environment: "production" # production | development
  reload: false # 仅在 development 模式生效
  output_dir: "output"

security:
  # HTTP Host 头白名单，生产环境请勿使用 "*"。
  allowed_hosts:
    - "127.0.0.1"
    - "localhost"
    # - "your-public-host.example.com"

  # 同源部署无需 CORS；独立 Vite 开发服务器时添加本地地址。
  cors_allowed_origins: []
  # - "http://127.0.0.1:5173"
  # - "http://localhost:5173"

  max_request_body_bytes: 536870912

  # 针对浏览器 Cookie 会话的双重提交 CSRF 防护。
  csrf:
    enabled: true
    cookie_name: "vf_csrf"
    header_name: "X-CSRF-Token"
    cookie_secure: true
    cookie_samesite: "lax"
    exempt_paths:
      - "/api/health"

  # 响应头安全增强。HSTS 仅当公网入口为 HTTPS 时开启；
  # CSP 在内置前端通过策略验证之前保持为空。
  headers:
    hsts_enabled: false
    content_security_policy: ""
